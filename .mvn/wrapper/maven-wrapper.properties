# Maven distribution URL - Using file:// protocol to point to pre-downloaded Maven
# The Maven distribution will be pre-downloaded in the Dockerfile using curl with authentication
# This avoids the Maven Wrapper's authentication issues with HTTPS downloads
distributionUrl=file:///tmp/apache-maven-3.9.0-bin.zip

# Maven wrapper JAR URL - This will also be pre-downloaded in the Dockerfile
# Keeping this as a placeholder since the JAR is copied directly to /.mvn/wrapper/maven-wrapper.jar
wrapperUrl=https://na.artifactory.swg-devops.com/artifactory/wasliberty-maven-remote/org/apache/maven/wrapper/maven-wrapper/3.2.0/maven-wrapper-3.2.0.jar
